spring.application.name=ordreDeMissison
server.port=${PORT:8080}
server.servlet.session.timeout=30m
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.web.locale=fr
app.portal.base-url=${PORTAL_BASE_URL:http://localhost:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mission_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
logging.level.org.springframework.security=${LOG_SECURITY:DEBUG}
logging.level.org.springframework.web=${LOG_WEB:DEBUG}

# Mail (optionnel — si vide, les notifications sont journalisees et ignorees)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

server.error.include-exception=false
server.error.include-stacktrace=never
