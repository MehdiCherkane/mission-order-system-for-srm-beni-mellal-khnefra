<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Missions')}"></head>
<body>
  <div class="page-wrapper">
    <header th:replace="~{fragments/layout :: header(user=${user})}"></header>
    <main class="page-main page-main--wide">

      <div class="dashboard-header">
        <h1>Toutes les missions <span class="badge badge--draft" th:text="${totalCount}">0</span></h1>
      </div>

      <form method="get" th:action="@{/admin/missions}" class="card" style="margin-bottom:1rem">
        <div class="form-row">
          <div class="form-group form-group--half">
            <label class="form-label" for="statut">Statut</label>
            <select class="form-select" id="statut" name="statut">
              <option value="all" th:selected="${statut == 'all'}">Tous</option>
              <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}" th:selected="${statut == s}"></option>
            </select>
          </div>
          <div class="form-group form-group--half">
            <label class="form-label" for="role">Rôle du demandeur</label>
            <select class="form-select" id="role" name="role">
              <option value="all" th:selected="${role == 'all'}">Tous</option>
              <option value="EMPLOYEE" th:selected="${role == 'EMPLOYEE'}">Employé</option>
              <option value="CHEF_HIERARCHIQUE" th:selected="${role == 'CHEF_HIERARCHIQUE'}">Chef</option>
              <option value="DIRECTEUR" th:selected="${role == 'DIRECTEUR'}">Directeur</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Filtrer</button>
          <a th:href="@{/admin/missions}" class="btn btn--outline">Réinitialiser</a>
        </div>
      </form>

      <div th:if="${#lists.isEmpty(missions)}" class="card card--centered">
        <div class="empty-state">
          <div class="empty-state__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div class="empty-state__title">Aucune mission trouvée</div>
          <div class="empty-state__desc">Aucune mission ne correspond aux filtres sélectionnés.</div>
        </div>
      </div>

      <div th:unless="${#lists.isEmpty(missions)}" class="card card--flush">
        <div class="table-wrapper table-to-cards">
          <table>
            <thead>
              <tr>
                <th>Demandeur</th>
                <th>Objet</th>
                <th>Destination</th>
                <th>Dates</th>
                <th>Statut</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m : ${missions}">
                <td data-label="Demandeur" th:text="${m.requesterPrenom + ' ' + m.requesterNom}">Demandeur</td>
                <td data-label="Objet" th:text="${m.objet}">Objet</td>
                <td data-label="Destination" th:text="${m.destination}">Destination</td>
                <td data-label="Dates">
                  <span class="date-time">
                    <span class="date-time__date" th:text="${#temporals.format(m.dateDepart, 'dd/MM')} + ' - ' + ${#temporals.format(m.dateRetour, 'dd/MM/yyyy')}">Dates</span>
                    <span class="date-time__time" th:text="${#temporals.format(m.dateDepart, 'HH:mm')} + ' - ' + ${#temporals.format(m.dateRetour, 'HH:mm')}">Heures</span>
                  </span>
                </td>
                <td data-label="Statut"><span class="badge" th:classappend="'badge--' + ${m.statutCss}" th:text="${m.statutLabel}">Statut</span></td>
                <td>
                  <a th:href="@{/admin/missions/{id}(id=${m.id})}" class="btn btn--outline btn--sm">Détail</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</body>
</html>
